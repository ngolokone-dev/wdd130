<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic quiz form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>

    <main>
        <form action="">
            <div class="quiz-item"></div>
            <label for="q1">
                1. What does the acronym css stand for?
            </label>
            <input type="text" id="q1" name="q1">
            </div>
            <br><br>

            <label for="q2">
                Explain the purpose of CSS.
            </label>
            <textarea id="q2" name="q2" rows="4"></textarea>

            <br><br>

            <label for="q3">
                Which HTML element is used for the largest heading?
            </label>
            <select id="q3" name="q3">
                <option value="">Choose One</option>
                <option value="h1">h1</option>
                <option value="h3">h3</option>
                <option value="p">p</option>
            </select>

            <br><br>

            <label for="q4">
                How many heading levels are available in HTML?
            </label>
            <input type="number" id="q4" name="q4">

            <br><br>

            <button type="submit">Submit Quiz</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 NGolo KONE</p>
    </footer>
</body>

</html>
