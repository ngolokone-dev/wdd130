<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Activity</title>
    <link rel="stylesheet" href="styles/table.css">
</head>

<body>
    <table>
        <caption>Team records and player counts by league</caption>

        ```
        <thead>
            <tr>
                <th scope="col">League</th>
                <th scope="col">Team</th>
                <th scope="col">Record</th>
                <th scope="col">Player Count</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="2">Southern</th>
                <th scope="row">Parana</th>
                <td>52-19</td>
                <td>23</td>
            </tr>
            <tr>
                <th scope="row">Catarina</th>
                <td>49-24</td>
                <td>10</td>
            </tr>
            <tr>
                <th scope="rowgroup" rowspan="3">Western</th>
                <th scope="row">Lacerda</th>
                <td>92-70</td>
                <td>27</td>
            </tr>
            <tr>
                <th scope="row">Acre</th>
                <td>75-87</td>
                <td>20</td>
            </tr>
            <tr>
                <th scope="row">Rondonia</th>
                <td>10-7</td>
                <td>12</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th scope="row" colspan="3">Total Players</th>
                <td>92</td>
            </tr>
        </tfoot>
    </table>
    ```

</body>

</html>
