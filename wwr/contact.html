<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Whitewater Rafting | Contact Us</title>

    <meta name="description"
      content="Contact Whitewater Rafting for reservations, questions, trip information, and rafting adventure planning.">

    <meta name="author" content="N'Golo KONE">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Whitewater Rafting Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <section class="contact-info">

            <h2>White Water Rafting Company</h2>

            <address>
                123 Main River Street<br>
                Kolob, California<br>
                <a href="tel:+19999999999">+1 999 999 9999</a><br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>

        </section>

        <section class="contact-content">

            <div class="map">

                <h2>Our Location</h2>

                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d..." width="600"
                  height="450" style="border:0;" allowfullscreen loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  title="White Water Rafting Company Location">
                </iframe>

            </div>

            <div class="contact-form">

                <h2>Send Us a Message</h2>

                <form action="#" method="post">

                    <label for="name">Name:</label>

                    <input type="text" id="name" name="name" placeholder="Your name" required>

                    <label for="email">Email:</label>

                    <input type="email" id="email" name="email" placeholder="Your email" required>

                    <fieldset>

                        <legend>Message Purpose</legend>

                        <label>
                            <input type="radio" name="purpose" value="general" required>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>

                    </fieldset>

                    <label for="message">Message:</label>

                    <textarea id="message" name="message" rows="6"
                      placeholder="Type your message here" required></textarea>

                    <label for="subscribe">

                        <input type="checkbox" id="subscribe" name="subscribe" value="yes">

                        Please Subscribe me to the monthly newsletter

                    </label>

                    <button type="submit">
                        Get in Touch!
                    </button>

                </form>

            </div>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-container">

                <figure>

                    <img src="images/employee1.jpg" alt="Whitewater Rafting employee">

                    <figcaption>
                        John Smith<br>
                        General Manager
                    </figcaption>

                </figure>

                <figure>

                    <img src="images/employee2.jpg" alt="Whitewater Rafting employee">

                    <figcaption>
                        Sarah Johnson<br>
                        Reservations Manager
                    </figcaption>

                </figure>

                <figure>

                    <img src="images/employee3.jpg" alt="Whitewater Rafting employee">

                    <figcaption>
                        Michael Brown<br>
                        Adventure Guide
                    </figcaption>

                </figure>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Splash Water Rafting | N'Golo KONE</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.jpg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.jpg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.jpg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
